# Alembic 配置。
# 数据库 URL 不在此硬编码，而是由 migrations/env.py 从 app.core.config.settings
# (sqlalchemy_database_uri) 读取，确保与应用运行时使用同一连接配置（SQLite/MySQL 自适应）。
#
# 用法：
#   cd backend && source .venv/bin/activate
#   alembic revision --autogenerate -m "describe change"
#   alembic upgrade head
#
# 说明：应用启动仍用 init_db() 的 create_all 做 bootstrap；Alembic 作为版本化迁移的演进路径。
# 首个基线迁移应在已有 create_all schema 上 `--autogenerate` 生成后人工核对再纳入。

[alembic]
script_location = migrations
prepend_sys_path = .
path_separator = os

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
