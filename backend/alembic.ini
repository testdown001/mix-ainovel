# Alembic configuration. Keep this INI ASCII-only because Alembic reads it with
# the operating-system locale on Windows. migrations/env.py obtains the URL from
# app.core.config.settings so migrations and the application use the same database.
#
# Usage:
#   cd backend && source .venv/bin/activate
#   alembic revision --autogenerate -m "describe change"
#   alembic upgrade head
#
# init_db() still bootstraps empty installations; Alembic owns versioned evolution.

[alembic]
script_location = migrations
prepend_sys_path = .
path_separator = os

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
