name: CI

on:
  push:
    branches:
      - main
      - master
  pull_request:

jobs:
  backend:
    name: Backend Tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # 版本须与 deploy/Dockerfile 的 python 基础镜像一致，否则 CI 绿灯不代表镜像能跑。
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-dev.txt

      - name: Run tests
        env:
          SECRET_KEY: test-secret
          ADMIN_DEFAULT_PASSWORD: test-password
          DB_PROVIDER: sqlite
        # 全量后端测试 + 覆盖率报告（test_phase4_integration.py 已删除，不再需要 --ignore）。
        run: pytest tests/ -q --cov=app --cov-report=term-missing

  gateway:
    name: Go Gateway Build & Test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: gateway
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: gateway/go.mod
          cache-dependency-path: gateway/go.sum

      - name: Build
        run: go build ./...

      - name: Vet
        run: go vet ./...

      - name: Test
        run: go test ./...

  frontend:
    name: Frontend Build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # 版本须与 deploy/Dockerfile 的 frontend-builder 阶段一致（见该文件顶部注释）。
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npm run type-check

      - name: Unit tests
        run: npm run test:unit

      - name: Build
        run: npm run build

      # 构建成功不代表样式还在：@import 位置写错会让整份组件样式被静默丢弃，
      # 构建零报错、单测与 type-check 全绿，只有打开页面才发现整站没样式。
      - name: Check CSS layers
        run: npm run check:css

  e2e:
    name: E2E Smoke (Playwright)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # 版本矩阵与 backend/frontend job 一致（= deploy/Dockerfile）
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install backend dependencies
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Build frontend dist
        working-directory: frontend
        run: npm run build-only

      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('frontend/package-lock.json') }}
          restore-keys: playwright-${{ runner.os }}-

      - name: Install Playwright chromium
        working-directory: frontend
        run: npx playwright install --with-deps chromium

      # 被测服务由 playwright.config.ts 的 webServer 拉起：
      # uvicorn 同源托管 API + dist（sqlite 零外部依赖），seed 脚本播种普通用户。
      - name: Run smoke tests
        working-directory: frontend
        run: npx playwright test

      - name: Upload traces on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-traces
          path: frontend/test-results/
          retention-days: 7
