# Nginx 负载均衡配置 - Arboris Novel (Phase 2: Go Gateway 集成)

user nginx;
worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
    worker_connections 4096;
    use epoll;
    multi_accept on;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for" '
                    'rt=$request_time uct="$upstream_connect_time" '
                    'uht="$upstream_header_time" urt="$upstream_response_time"';

    access_log /var/log/nginx/access.log main;

    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    types_hash_max_size 2048;
    client_max_body_size 100M;

    # Gzip 压缩
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/xml text/javascript
               application/json application/javascript application/xml+rss
               application/rss+xml font/truetype font/opentype
               application/vnd.ms-fontobject image/svg+xml;

    # Go Gateway 上游（主入口）
    upstream go_gateway {
        least_conn;
        server gateway:3000 max_fails=3 fail_timeout=30s;
        keepalive 64;
    }

    # FastAPI 后端上游（直连，用于不经过 Gateway 的请求，如前端静态/SPA）
    # 注意：app 容器内 uvicorn 仅监听 127.0.0.1:8000（loopback，跨容器不可达），
    #       对外只暴露容器内 nginx 的 :80（supervisord + nginx.standalone.conf）。
    #       因此上游必须连 app:80，连 app:8000 会全部 502。
    upstream fastapi_backend {
        least_conn;
        server app:80 max_fails=3 fail_timeout=30s;
        keepalive 32;
    }

    server {
        listen 80;
        server_name _;

        # 健康检查
        location /health {
            access_log off;
            proxy_pass http://go_gateway;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
        }

        # WebSocket 连接 → Go Gateway
        location /ws {
            proxy_pass http://go_gateway;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_read_timeout 86400s;
            proxy_send_timeout 86400s;
        }

        # 任务管理 API → Go Gateway (Task Dispatcher)
        location /tasks/ {
            proxy_pass http://go_gateway;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Connection "";
            proxy_connect_timeout 10s;
            proxy_send_timeout 30s;
            proxy_read_timeout 30s;
        }

        # 注：原 /llm/ 路由指向的 internal/llmgateway 包为无入口装配的死代码，已删除。
        # Go 网关不提供 /llm/ handler，故该 nginx location 一并移除（命中只会 404）。
        # LLM 调用统一由 Python FastAPI 经 llm_service 处理。

        # Prometheus 指标 → Go Gateway
        location /metrics {
            access_log off;
            proxy_pass http://go_gateway;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
        }

        # SSE 流式生成 → 直连 FastAPI，绕开 Go 网关。
        #
        # 网关的反代是 Fiber 的 proxy.Do()，它基于 fasthttp 客户端：整个响应体读完才返回，
        # 没有流式转发。于是经网关的 SSE 全程零输出，直到生成结束才一次性吐出所有事件
        # ——2026-08-14 实测：直连 app 立刻收到 started/stage 事件，经网关 25 秒一个字节都没有。
        # 逐字草稿、阶段进度这些「让等待可见」的东西在生产上因此完全失效。
        #
        # 绕开网关只丢掉网关侧限流：该端点自身在 FastAPI 里校验 JWT（Depends(get_current_user)）、
        # 走档位门控与积分扣费，且 FastAPI 有自己的 RateLimitMiddleware。
        # 精确匹配优先于下方 /api/ 前缀匹配。
        location = /api/writer/advanced/generate/stream {
            proxy_pass http://fastapi_backend;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Connection "";
            proxy_connect_timeout 10s;
            proxy_send_timeout 900s;
            proxy_read_timeout 900s;
            proxy_buffering off;
            proxy_request_buffering off;
            proxy_cache off;
            proxy_set_header X-Accel-Buffering no;
            chunked_transfer_encoding on;
        }

        # 所有 API 请求 → Go Gateway（认证 + 限流 → 反向代理到 FastAPI）
        location /api/ {
            proxy_pass http://go_gateway;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Connection "";
            proxy_connect_timeout 10s;
            proxy_send_timeout 300s;
            proxy_read_timeout 300s;
            proxy_buffering off;
            proxy_request_buffering off;
            proxy_cache off;
            proxy_set_header X-Accel-Buffering no;
        }

        # 静态资源和前端 → 直接代理到 FastAPI（FastAPI 服务前端 dist + SPA 回退）
        location / {
            proxy_pass http://fastapi_backend;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }

    # ============ HTTPS（可选，生产强烈建议启用）============
    # 现状：默认仅 HTTP(80)。若以 HTTP 对外，请同时设后端 FORCE_HTTPS_REDIRECT=false，
    #       否则 FastAPI（生产模式）会把请求 308 跳转到不存在的 https，导致全站打不开。
    #
    # 启用 HTTPS 步骤：
    #   1) 将证书链与私钥放入 deploy/ssl/（compose 已挂载到容器 /etc/nginx/ssl/）：
