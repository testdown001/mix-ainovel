# 生产环境 Docker Compose 配置
# 支持水平扩展：Nginx LB + 多 API 实例 + Celery Worker 集群

version: '3.8'

services:
  # Nginx 负载均衡器
  nginx:
    image: nginx:alpine
    container_name: arboris-nginx
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - ./ssl:/etc/nginx/ssl:ro
    depends_on:
      - gateway
    restart: unless-stopped
    networks:
      - app-network
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  # Go API Gateway（Phase 2 核心组件）
  gateway:
    build:
      context: ../gateway
      dockerfile: Dockerfile
    image: arboris-gateway:latest
    deploy:
      replicas: 2
      resources:
        limits:
          cpus: '1'
          memory: 512M
        reservations:
          cpus: '0.5'
          memory: 256M
    ports:
      - "3000:3000"
    environment:
      GATEWAY_SERVER_HOST: "0.0.0.0"
      GATEWAY_SERVER_PORT: "3000"
      GATEWAY_REDIS_ADDR: "redis:6379"
      GATEWAY_REDIS_PASSWORD: ""
      GATEWAY_JWT_SECRET: ${SECRET_KEY}
      GATEWAY_BACKEND_FASTAPI_URL: "http://app:8000"
      GATEWAY_TASK_DISPATCHER_WORKER_CALLBACK_URL: "http://app:8000/api/internal/tasks"
    volumes:
      - ../gateway/config.yaml:/app/config.yaml:ro
    restart: unless-stopped
    depends_on:
      - redis
      - app
    networks:
      - app-network
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:3000/health"]
      interval: 15s
      timeout: 5s
      retries: 3

  # FastAPI 应用实例（可扩展）
  app:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    image: arboris-app:latest
    deploy:
      replicas: 3  # 3 个 API 实例
      resources:
        limits:
          cpus: '2'
          memory: 2G
        reservations:
          cpus: '1'
          memory: 1G
    environment:
      SECRET_KEY: ${SECRET_KEY:?请设置SECRET_KEY}
      ENVIRONMENT: production
      DEBUG: false
      LOGGING_LEVEL: ${LOGGING_LEVEL:-INFO}

      # 数据库配置
      DB_PROVIDER: ${DB_PROVIDER:-mysql}
      MYSQL_HOST: ${MYSQL_HOST:-mysql}
      MYSQL_PORT: ${MYSQL_PORT:-3306}
      MYSQL_USER: ${MYSQL_USER:-arboris}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?请设置数据库密码}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-arboris}

      # Redis 配置
      REDIS_URL: ${REDIS_URL:-redis://redis:6379/0}

      # 管理员配置
      ADMIN_DEFAULT_USERNAME: ${ADMIN_DEFAULT_USERNAME:-admin}
      ADMIN_DEFAULT_PASSWORD: ${ADMIN_DEFAULT_PASSWORD:?请设置管理员密码}
      ADMIN_DEFAULT_EMAIL: ${ADMIN_DEFAULT_EMAIL:-admin@example.com}

      # LLM 配置
      OPENAI_API_KEY: ${OPENAI_API_KEY:?请设置OPENAI_API_KEY}
      OPENAI_API_BASE_URL: ${OPENAI_API_BASE_URL:-https://api.openai.com/v1}
      OPENAI_MODEL_NAME: ${OPENAI_MODEL_NAME:-gpt-4o-mini}
      WRITER_CHAPTER_VERSION_COUNT: ${WRITER_CHAPTER_VERSION_COUNT:-1}

      # 嵌入模型配置
      EMBEDDING_PROVIDER: ${EMBEDDING_PROVIDER:-openai}
      EMBEDDING_BASE_URL: ${EMBEDDING_BASE_URL:-https://api.openai.com/v1}
      EMBEDDING_API_KEY: ${EMBEDDING_API_KEY:-${OPENAI_API_KEY}}
      EMBEDDING_MODEL: ${EMBEDDING_MODEL:-text-embedding-3-large}

      # 向量数据库配置
      VECTOR_DB_URL: ${VECTOR_DB_URL:-file:/app/storage/rag_vectors.db}
      VECTOR_TOP_K_CHUNKS: ${VECTOR_TOP_K_CHUNKS:-5}
      VECTOR_TOP_K_SUMMARIES: ${VECTOR_TOP_K_SUMMARIES:-3}

      # Qdrant 配置（Mem0）
      QDRANT_HOST: ${QDRANT_HOST:-qdrant}
      QDRANT_PORT: ${QDRANT_PORT:-6333}
      QDRANT_API_KEY: ${QDRANT_API_KEY:-}

      # 用户注册配置
      ALLOW_USER_REGISTRATION: ${ALLOW_USER_REGISTRATION:-false}

    restart: unless-stopped
    depends_on:
      - mysql
      - redis
      - qdrant
    volumes:
      - app-storage:/app/storage
    networks:
      - app-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://127.0.0.1:8000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 90s

  # Celery Worker - 章节生成队列
  celery-worker-chapter:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    image: arboris-app:latest
    command: celery -A app.tasks.celery_app worker -Q chapter_generation -c 4 --loglevel=info --max-tasks-per-child=50
    deploy:
      replicas: 3  # 3 个章节生成 Worker
      resources:
        limits:
          cpus: '2'
          memory: 3G
        reservations:
          cpus: '1'
          memory: 2G
    environment:
      SECRET_KEY: ${SECRET_KEY}
      ENVIRONMENT: production
      DEBUG: false
      LOGGING_LEVEL: ${LOGGING_LEVEL:-INFO}
      DB_PROVIDER: ${DB_PROVIDER:-mysql}
      MYSQL_HOST: ${MYSQL_HOST:-mysql}
      MYSQL_PORT: ${MYSQL_PORT:-3306}
      MYSQL_USER: ${MYSQL_USER:-arboris}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-arboris}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379/0}
      OPENAI_API_KEY: ${OPENAI_API_KEY}
      OPENAI_API_BASE_URL: ${OPENAI_API_BASE_URL:-https://api.openai.com/v1}
      OPENAI_MODEL_NAME: ${OPENAI_MODEL_NAME:-gpt-4o-mini}
      EMBEDDING_PROVIDER: ${EMBEDDING_PROVIDER:-openai}
      EMBEDDING_BASE_URL: ${EMBEDDING_BASE_URL:-https://api.openai.com/v1}
      EMBEDDING_API_KEY: ${EMBEDDING_API_KEY:-${OPENAI_API_KEY}}
      EMBEDDING_MODEL: ${EMBEDDING_MODEL:-text-embedding-3-large}
      VECTOR_DB_URL: ${VECTOR_DB_URL:-file:/app/storage/rag_vectors.db}
      QDRANT_HOST: ${QDRANT_HOST:-qdrant}
      QDRANT_PORT: ${QDRANT_PORT:-6333}
    restart: unless-stopped
    depends_on:
      - mysql
      - redis
      - qdrant
    volumes:
      - app-storage:/app/storage
    networks:
      - app-network

  # Celery Worker - 批量生成队列
  celery-worker-batch:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    image: arboris-app:latest
    command: celery -A app.tasks.celery_app worker -Q batch_generation -c 2 --loglevel=info --max-tasks-per-child=20
    deploy:
      replicas: 2  # 2 个批量生成 Worker
      resources:
        limits:
          cpus: '2'
          memory: 3G
        reservations:
          cpus: '1'
          memory: 2G
    environment:
      SECRET_KEY: ${SECRET_KEY}
      ENVIRONMENT: production
      DEBUG: false
      LOGGING_LEVEL: ${LOGGING_LEVEL:-INFO}
      DB_PROVIDER: ${DB_PROVIDER:-mysql}
      MYSQL_HOST: ${MYSQL_HOST:-mysql}
      MYSQL_PORT: ${MYSQL_PORT:-3306}
      MYSQL_USER: ${MYSQL_USER:-arboris}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-arboris}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379/0}
      OPENAI_API_KEY: ${OPENAI_API_KEY}
      OPENAI_API_BASE_URL: ${OPENAI_API_BASE_URL}
      OPENAI_MODEL_NAME: ${OPENAI_MODEL_NAME:-gpt-4o-mini}
      EMBEDDING_PROVIDER: ${EMBEDDING_PROVIDER:-openai}
      EMBEDDING_BASE_URL: ${EMBEDDING_BASE_URL}
      EMBEDDING_API_KEY: ${EMBEDDING_API_KEY:-${OPENAI_API_KEY}}
      EMBEDDING_MODEL: ${EMBEDDING_MODEL:-text-embedding-3-large}
      VECTOR_DB_URL: ${VECTOR_DB_URL:-file:/app/storage/rag_vectors.db}
      QDRANT_HOST: ${QDRANT_HOST:-qdrant}
      QDRANT_PORT: ${QDRANT_PORT:-6333}
    restart: unless-stopped
    depends_on:
      - mysql
      - redis
      - qdrant
    volumes:
      - app-storage:/app/storage
    networks:
      - app-network

  # Celery Beat - 定时任务调度器
  celery-beat:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    image: arboris-app:latest
    command: celery -A app.tasks.celery_app beat --loglevel=info
    environment:
      SECRET_KEY: ${SECRET_KEY}
      ENVIRONMENT: production
      DEBUG: false
      REDIS_URL: ${REDIS_URL:-redis://redis:6379/0}
    restart: unless-stopped
    depends_on:
      - redis
    networks:
      - app-network

  # Flower - Celery 监控面板
  flower:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    image: arboris-app:latest
    command: celery -A app.tasks.celery_app flower --port=5555
    ports:
      - "5555:5555"
    environment:
      CELERY_BROKER_URL: ${REDIS_URL:-redis://redis:6379/0}
      CELERY_RESULT_BACKEND: ${REDIS_URL:-redis://redis:6379/1}
    restart: unless-stopped
    depends_on:
      - redis
    networks:
      - app-network

  # MySQL 数据库
  mysql:
    image: mysql:8.0
    container_name: arboris-mysql
    ports:
      - "3306:3306"
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?请设置MySQL root密码}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-arboris}
      MYSQL_USER: ${MYSQL_USER:-arboris}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?请设置数据库密码}
    volumes:
      - mysql-data:/var/lib/mysql
      - ./mysql.cnf:/etc/mysql/conf.d/custom.cnf:ro
    restart: unless-stopped
    networks:
      - app-network
    command: --default-authentication-plugin=mysql_native_password --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci

  # Redis 缓存和消息队列
  redis:
    image: redis:7-alpine
    container_name: arboris-redis
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    restart: unless-stopped
    networks:
      - app-network
    command: redis-server --appendonly yes --maxmemory 2gb --maxmemory-policy allkeys-lru
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 30s
      timeout: 10s
      retries: 3

  # Qdrant 向量数据库（Mem0）
  qdrant:
    image: qdrant/qdrant:latest
    container_name: arboris-qdrant
    ports:
      - "6333:6333"
    volumes:
      - qdrant-data:/qdrant/storage
    restart: unless-stopped
    networks:
      - app-network

volumes:
  app-storage:
    driver: local
  mysql-data:
    driver: local
  redis-data:
    driver: local
  qdrant-data:
    driver: local

networks:
  app-network:
    driver: bridge
