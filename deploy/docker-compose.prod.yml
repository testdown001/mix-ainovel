# 生产环境 Docker Compose 配置
# 支持水平扩展：Nginx LB + Go Gateway + 多 API 实例

version: '3.8'

services:
  # Nginx 负载均衡器
  nginx:
    image: nginx:alpine
    container_name: arboris-nginx
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - ./ssl:/etc/nginx/ssl:ro
    depends_on:
      - gateway
    restart: unless-stopped
    networks:
      - app-network
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  # Go API Gateway（Phase 2 核心组件）
  gateway:
    build:
      context: ../gateway
      dockerfile: Dockerfile
    image: arboris-gateway:latest
    deploy:
      replicas: 2
      resources:
        limits:
          cpus: '1'
          memory: 512M
        reservations:
          cpus: '0.5'
          memory: 256M
    # 不发布宿主端口：replicas>1 时多副本会抢同一宿主端口导致只起一个、up 中断、nginx 连带起不来。
    # 前置 nginx 经内网 DNS（upstream go_gateway → gateway:3000）轮询访问各副本，无需对外暴露 3000。
    expose:
      - "3000"
    environment:
      GATEWAY_SERVER_HOST: "0.0.0.0"
      GATEWAY_SERVER_PORT: "3000"
      GATEWAY_REDIS_ADDR: "redis:6379"
      GATEWAY_REDIS_PASSWORD: ""
      GATEWAY_JWT_SECRET: ${SECRET_KEY}
      # app 容器内 uvicorn 仅监听 127.0.0.1:8000（loopback），跨容器只能连 :80（容器内 nginx）
      GATEWAY_BACKEND_FASTAPI_URL: "http://app:80"
      GATEWAY_TASK_DISPATCHER_WORKER_CALLBACK_URL: "http://app:80/api/internal/tasks"
      GATEWAY_TASK_DISPATCHER_INTERNAL_CALLBACK_SECRET: ${TASK_DISPATCHER_INTERNAL_CALLBACK_SECRET:?请设置任务回调共享密钥}
    volumes:
      - ./gateway-config.yaml:/root/config.yaml:ro
    restart: unless-stopped
    depends_on:
      - redis
      - app
    networks:
      - app-network
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:3000/health"]
      interval: 15s
      timeout: 5s
      retries: 3

  # FastAPI 应用实例（可扩展）
  app:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    image: arboris-app:latest
    deploy:
      replicas: 3  # 3 个 API 实例
      resources:
        limits:
          cpus: '2'
          memory: 2G
        reservations:
          cpus: '1'
          memory: 1G
    environment:
      SECRET_KEY: ${SECRET_KEY:?请设置SECRET_KEY}
      ENVIRONMENT: production
      DEBUG: false
      LOGGING_LEVEL: ${LOGGING_LEVEL:-INFO}
      # TLS 在前置 nginx/LB 层终止；以 HTTP 对外时必须为 false，否则 FastAPI(生产模式)
      # 会把请求 308 跳到不存在的 https 导致全站打不开。启用 HTTPS 后再设为 true。
      FORCE_HTTPS_REDIRECT: ${FORCE_HTTPS_REDIRECT:-false}

      # 数据库配置
      DB_PROVIDER: ${DB_PROVIDER:-mysql}
      MYSQL_HOST: ${MYSQL_HOST:-mysql}
      MYSQL_PORT: ${MYSQL_PORT:-3306}
      MYSQL_USER: ${MYSQL_USER:-arboris}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?请设置数据库密码}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-arboris}

      # Redis 配置
      REDIS_URL: ${REDIS_URL:-redis://redis:6379/0}
      TASK_DISPATCHER_INTERNAL_CALLBACK_SECRET: ${TASK_DISPATCHER_INTERNAL_CALLBACK_SECRET:?请设置任务回调共享密钥}

      # 管理员配置
      ADMIN_DEFAULT_USERNAME: ${ADMIN_DEFAULT_USERNAME:-admin}
      ADMIN_DEFAULT_PASSWORD: ${ADMIN_DEFAULT_PASSWORD:?请设置管理员密码}
      ADMIN_DEFAULT_EMAIL: ${ADMIN_DEFAULT_EMAIL:-admin@example.com}

      # LLM 配置
      OPENAI_API_KEY: ${OPENAI_API_KEY:?请设置OPENAI_API_KEY}
      OPENAI_API_BASE_URL: ${OPENAI_API_BASE_URL:-https://api.openai.com/v1}
      OPENAI_MODEL_NAME: ${OPENAI_MODEL_NAME:-gpt-4o-mini}
      WRITER_CHAPTER_VERSION_COUNT: ${WRITER_CHAPTER_VERSION_COUNT:-1}

      # 嵌入模型配置
      EMBEDDING_PROVIDER: ${EMBEDDING_PROVIDER:-openai}
      EMBEDDING_BASE_URL: ${EMBEDDING_BASE_URL:-https://api.openai.com/v1}
      EMBEDDING_API_KEY: ${EMBEDDING_API_KEY:-${OPENAI_API_KEY}}
      EMBEDDING_MODEL: ${EMBEDDING_MODEL:-text-embedding-3-large}

      # 向量数据库配置
      VECTOR_DB_URL: ${VECTOR_DB_URL:-file:/app/storage/rag_vectors.db}
      VECTOR_TOP_K_CHUNKS: ${VECTOR_TOP_K_CHUNKS:-5}
      VECTOR_TOP_K_SUMMARIES: ${VECTOR_TOP_K_SUMMARIES:-3}

      # Qdrant 配置（Mem0）
      QDRANT_HOST: ${QDRANT_HOST:-qdrant}
      QDRANT_PORT: ${QDRANT_PORT:-6333}
      QDRANT_API_KEY: ${QDRANT_API_KEY:-}

      # 用户注册配置
      ALLOW_USER_REGISTRATION: ${ALLOW_USER_REGISTRATION:-false}

    restart: unless-stopped
    depends_on:
      - mysql
      - redis
      - qdrant
    volumes:
      - app-storage:/app/storage
    networks:
      - app-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://127.0.0.1:8000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 90s


  # MySQL 数据库
  mysql:
    image: mysql:8.0
    container_name: arboris-mysql
    ports:
      - "3306:3306"
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?请设置MySQL root密码}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-arboris}
      MYSQL_USER: ${MYSQL_USER:-arboris}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?请设置数据库密码}
    volumes:
      - mysql-data:/var/lib/mysql
      - ./mysql.cnf:/etc/mysql/conf.d/custom.cnf:ro
    restart: unless-stopped
    networks:
      - app-network
    command: --default-authentication-plugin=mysql_native_password --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci

  # Redis 缓存和消息队列
  redis:
    image: redis:7-alpine
    container_name: arboris-redis
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    restart: unless-stopped
    networks:
      - app-network
    command: redis-server --appendonly yes --maxmemory 2gb --maxmemory-policy allkeys-lru
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 30s
      timeout: 10s
      retries: 3

  # Qdrant 向量数据库（Mem0）
  qdrant:
    image: qdrant/qdrant:latest
    container_name: arboris-qdrant
    ports:
      - "6333:6333"
    volumes:
      - qdrant-data:/qdrant/storage
    restart: unless-stopped
    networks:
      - app-network

volumes:
  app-storage:
    driver: local
  mysql-data:
    driver: local
  redis-data:
    driver: local
  qdrant-data:
    driver: local

networks:
  app-network:
    driver: bridge
