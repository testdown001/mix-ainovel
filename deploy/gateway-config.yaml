# Gateway 配置 — Docker 部署环境
# 此文件在 docker-compose 中挂载到 /app/config.yaml

server:
  host: "0.0.0.0"
  port: 3000
  read_timeout: 10s
  write_timeout: 120s
  prefork: false

backend:
  # app 容器内 uvicorn 仅监听 127.0.0.1:8000（loopback），跨容器只能连 :80（容器内 nginx）
  fastapi_url: "http://app:80"
  timeout: 120s

jwt:
  secret: "change-me-in-production"
  issuer: "arboris-gateway"
  audience: "arboris-api"

redis:
  mode: "standalone"
  addr: "redis:6379"
  password: ""
  db: 0
  pool_size: 100
  min_idle: 20

database:
  enabled: false

payment:
  enabled: false

rate_limit:
  default_tpm: 100000
  default_concurrent: 3
  default_rpm: 200
  default_rps: 10
  premium_tpm: 300000
  premium_concurrent: 8
  premium_rpm: 500
  premium_rps: 30
  # 未认证用户按 IP 的每分钟上限（登录前无 JWT 走此桶；过小会导致管理员登录被 429）
  unauth_ip_rpm: 120

websocket:
  max_connections: 10000
  read_buffer_size: 1024
  write_buffer_size: 1024
  ping_interval: 30s
  pong_timeout: 60s

log:
  level: "info"
  format: "json"
  output: "stdout"
  file_path: "logs/gateway.log"

metrics:
  enabled: true
  path: "/metrics"

task_dispatcher:
  enabled: true
  max_concurrency: 20
  max_per_user: 3
  # 宽松上限：仅作兜底。思考/推理模型整章生成可能需 20~30 分钟，10m 会被中途取消→
  # 网关报 500。Python 侧每个 LLM 调用自带 ~180s 超时会快速掐掉真卡死的调用，故宽松上限
  # 不会让"快模型/失败"傻等，只给慢的思考模型留足时间。需要更久可继续调大。
  default_timeout: 30m
  # 连续生成支持 25/50 章，按 2~4 分钟/章预留 6 小时。
  batch_timeout: 360m
  blueprint_timeout: 15m     # 蓝图生成任务超时（两段式 LLM，通常 5~12min）
  max_retries: 3
  retry_delay: 5s
  poll_interval: 100ms
  worker_callback_url: "http://app:80/api/internal/tasks"
  worker_grpc_addr: ""
  internal_callback_secret: "change-me-in-production"
