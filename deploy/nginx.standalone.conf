# 单容器部署（deploy/docker-compose.yml）专用 Nginx 主配置。
# 镜像内 uvicorn 监听 127.0.0.1:8000，由 FastAPI 直接服务前端静态资源（dist）与 /api。
# 注意：单容器栈不含 Go Gateway，故 /ws（实时进度）与 /tasks（异步任务分发）不可用——
#       需要这些能力请改用生产栈 deploy/docker-compose.prod.yml（独立 nginx + gateway）。
# 本文件被 deploy/Dockerfile 覆盖到 /etc/nginx/nginx.conf（自包含，不依赖 sites-enabled/conf.d）。

user www-data;
worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
    worker_connections 2048;
    use epoll;
    multi_accept on;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    types_hash_max_size 2048;
    client_max_body_size 100M;

    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/xml text/javascript
               application/json application/javascript application/xml+rss
               image/svg+xml;

    upstream backend {
        server 127.0.0.1:8000;
        keepalive 32;
    }

    server {
        listen 80;
        server_name _;

        # 全部转发给 FastAPI：前端静态/SPA 回退与 /api 均由后端同源处理。
        # SSE/流式生成需要关闭缓冲，故 proxy_buffering off。
        location / {
            proxy_pass http://backend;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Connection "";
            proxy_connect_timeout 10s;
            proxy_send_timeout 600s;
            proxy_read_timeout 600s;
            proxy_buffering off;
            proxy_request_buffering off;
        }
    }
}
