server:
  host: "0.0.0.0"
  port: 3000
  read_timeout: 10s
  write_timeout: 120s  # LLM 流式需要长超时
  prefork: false  # 开发环境关闭，生产环境开启

backend:
  fastapi_url: "http://localhost:8000"
  timeout: 120s

jwt:
  secret: "your-secret-key-change-in-production"
  issuer: "arboris-gateway"
  audience: "arboris-api"

redis:
  mode: "standalone"         # standalone | sentinel | cluster
  addr: "localhost:6379"
  password: ""
  db: 0
  pool_size: 100
  min_idle: 20

# 数据库配置（可选，启用后 Go API 服务直连 MySQL）
database:
  enabled: false             # 开发阶段默认关闭，启用后需要 MySQL
  host: "localhost"
  port: 3306
  user: "root"
  password: ""
  name: "arboris"
  read_hosts: []             # 读副本地址列表，空则不启用读写分离
  writer_max_open: 50
  writer_max_idle: 10
  writer_max_lifetime: 5m
  writer_max_idle_time: 3m
  reader_max_open: 100
  reader_max_idle: 20
  reader_max_lifetime: 5m
  reader_max_idle_time: 3m
  slow_threshold: 200ms
  log_level: "warn"          # silent | error | warn | info

# 支付配置（启用后需要 Stripe 密钥）
payment:
  enabled: false
  stripe_secret_key: ""          # sk_test_xxx or sk_live_xxx
  stripe_webhook_secret: ""      # whsec_xxx
  success_url: "http://localhost:5173/settings?tab=subscription&status=success"
  cancel_url: "http://localhost:5173/settings?tab=subscription&status=cancel"
  webhook_workers: 4             # Webhook Worker Pool goroutine 数
  webhook_queue_size: 100        # channel 队列深度（满时返回 429）

rate_limit:
  # 普通用户
  default_tpm: 100000  # 100K tokens per minute
  default_concurrent: 3
  default_rpm: 60  # requests per minute
  default_rps: 10  # requests per second

  # Premium 用户
  premium_tpm: 300000  # 300K tokens per minute
  premium_concurrent: 8
  premium_rpm: 180
  premium_rps: 30

websocket:
  max_connections: 10000
  read_buffer_size: 1024
  write_buffer_size: 1024
  ping_interval: 30s
  pong_timeout: 60s

log:
  level: "info"  # debug, info, warn, error
  format: "json"  # json, console
  output: "stdout"  # stdout, file
  file_path: "logs/gateway.log"

metrics:
  enabled: true
  path: "/metrics"

# 跨域配置：留空或包含 "*" 为通配（默认，保持既有行为）；
# 生产建议收紧为与 Python 端 CORS_ORIGINS 一致的白名单，例如：
#   origins: ["https://app.example.com"]
cors:
  origins: ["*"]

task_dispatcher:
  enabled: true
  max_concurrency: 20       # 全局最大并发任务数
  max_per_user: 3            # 每用户最大并发任务数
  default_timeout: 30m       # 单章节生成超时（宽松兜底；思考模型可能 20~30min，Python 每调用 ~180s 超时会快速掐掉真卡死的）
  batch_timeout: 120m        # 批量生成超时
  max_retries: 3             # 最大重试次数
  retry_delay: 5s            # 初始重试延迟（指数退避）
  poll_interval: 100ms       # 队列轮询间隔
  worker_callback_url: "http://localhost:8000/api/internal/tasks"  # Python Worker
  worker_grpc_addr: "localhost:50051"  # gRPC 地址（预留）
  internal_callback_secret: ""  # 内部进度回调共享密钥；留空不校验，非空时回调须带 X-Internal-Secret 头
